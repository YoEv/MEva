# project_root: 不在这里写死；默认由环境变量 PROJECT_ROOT 提供
# （Python 端使用 cfg.get("project_root", os.environ.get("PROJECT_ROOT", ...)) 解析）。
# 在服务器端登录后先执行：
#   export PROJECT_ROOT=/home/<user>/<path_to>/MEva
# 若需要强制指定，可取消下一行注释并填上绝对路径：
# project_root: "/absolute/path/to/MEva"

data:
  splits:
    clean:
      train: "data/splits/musiceval/train.csv"
      val: "data/splits/musiceval/val.csv"
      test: "data/splits/musiceval/test.csv"
  feature_roots:
    token_loss_root: "features/loss"
    sae_feature_root: "features/sae"
  preprocess:
    musiceval_source_split_root: "experiments/phase7/loss_eval_experiments/exp11_large_scale_replication/1_data_preparation"
    full_scale_pairwise_out_root: "data/manifests/pairwise_scaled"
  full_scale:
    dataset_config: "config/data/full_datasets.yaml"

outputs:
  root: "outputs"
  checkpoints: "outputs/checkpoints"
  logs: "outputs/logs"
  plots: "outputs/plots"
  reports: "outputs/reports"
  features_loss: "features/loss"
  features_entropy: "features/entropy"

seq_len: 1500
sae_hidden_dim: 16384

sae:
  backend: "musicdiscovery"
  musicdiscovery_checkpoint_dir: "external/musicdiscovery_checkpoints/sae-4_k_32_layer_12/facebook/musicgen-small"
  output_dir: "features/sae"

training:
  defaults:
    loss_curve_cnn:
      epochs: 100
      batch_size: 64
      lr: 0.0001
      weight_decay: 0.0001
      patience: 10
      lr_decay_factor: 0.5
      lr_decay_patience: 3
      min_lr: 1.0e-6
    entropy_curve_cnn:
      epochs: 100
      batch_size: 64
      lr: 0.0001
      weight_decay: 0.0001
      patience: 10
      lr_decay_factor: 0.5
      lr_decay_patience: 3
      min_lr: 1.0e-6
    hybrid_cnn:
      epochs: 50
      batch_size: 8
      lr: 0.0001
      weight_decay: 0.0001
      patience: 8
      lr_decay_factor: 0.5
      lr_decay_patience: 3
      min_lr: 1.0e-6
