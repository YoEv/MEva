experiment_family_id: "f02"
experiment_family_name: "entropy_only"
backbone: "cnn"

legacy_script_key: "train_hybrid_cnn"

data:
  manifest_columns_required:
    - "score"
    - "audio_path"
    - "token_loss_path"
    - "entropy_curve_path"
  label_column: "score"

optimization:
  batch_size: 24
  num_workers: 6
  epochs: 10
  lr: 0.0001
  weight_decay: 0.0
  eval_num_workers: 0
  prefetch_factor: 1

checkpoint:
  name_template: "f02_entropy_only_cnn_{dataset_scope}"
